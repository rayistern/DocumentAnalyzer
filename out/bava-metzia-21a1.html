<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <title>Daf</title>
  <style>body{margin:0;padding:0;font-family:"Times New Roman",serif;}</style>
  <script src="https://unpkg.com/daf-renderer@latest/dist/daf-renderer.min.js"></script>
</head>
<body>
  <div id="daf" style="margin:2rem;"></div>

  <script>
    (function init() {
      if (!window.dafRenderer) return setTimeout(init, 20);

      const renderer = window.dafRenderer("#daf", {
        contentWidth: "900px",
        fontFamily: { main: "Times New Roman", inner: "Times New Roman", outer: "Times New Roman" }
      });

      renderer.render(
        `דער ענין פון ספרים איז דאך א ענין פון חכמה – דאס רעדט זיך דאך וועגן ספרי חכמה, און חכמהקדושה, פון חכמת התורה, במילא, אז ס׳קומט צו נאך א ספר – קומט צו אין די אלע ספרים וואס מ׳האט פון פריער נאך פאר דעם, כמובן בפשטות, אז דורך דערויף וואס ס׳קומט צו די ידיעה שבספר החדש – קומט צו אויכעט א הוספה אין די ידיעות אין די ספרים וואס מ׳האט געלערנט נאך פאר דעם, אדער מ׳גייט לערנען, און די ספרים האט מען שוין, און מ׳גייט לערנען נאכאמאל, דעם רבי׳ן דעם שווער. און דאס זאל נאכמערער צוהיילן, די אומקערונג פון די ספרים האמורים, נוסף אויף די ספרים וואס זיינען שוין אומגעקערט געווארן, צוזאמען מיט דיכתבי יד המצורפים לספרים אלו.ה. ועוד והוא העיקר – אז דאס זאל גיין צוזאמען,ואדרבה, והוא העיקר – צוזאמען מיט דער גאולה, און דער סיום הגאולה, די התחלת הגאולה צוזאמעןמיט סיום הגאולה בפשטות, ע״י האמור ומוזכר לעיל, אז ״בנערינו ובזקנינו ובבנינו ובבנותינו״, צוזאמען מיט אלע ספרים, און צוזאמען מיט די ספרים וואס מ׳האט שוין אומגעקערט, און כתבי יד, און וואס מ׳וועט אומקערן תיכף ומיד ממש, ועוד והעיקר – (אין א פרשתפון) ״בנערינו ובזקנינו ובבנינו ובבנותינו״, האנשים והנשים והטף – איז ״ארו עם ענני שמיא״, צוזאמעןמיט די החלטות טובות בנוגע צו צדקה און צו מעשיםטובים בכלל ובפרט,וועט מען גלייך זיין, כמדובר, בארצנו הקדושה, און דארט – אין ירושלים עיר הקודש, ובהר הקודש,ובבית המקדש השלישי,ו`,
        `<em>no metadata yet</em><em>no metadata yet</em>`,
        ``,
        "b"
      );
    })();
  </script>
</body>
</html>
