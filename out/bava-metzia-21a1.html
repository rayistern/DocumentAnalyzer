<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <title>Daf</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #daf {
      margin: 2rem;
    }
    /* System fonts with Hebrew support */
    [lang="he"] {
      font-family: "Times New Roman", serif;
    }
    [lang="en"], .commentary {
      font-family: "Arial", "Helvetica", sans-serif;
    }
    
    /* Override renderer styles with !important */
    .amud-main > div {
      margin-bottom: 2em !important;
      padding-bottom: 1em !important;
    }
    .amud-inner > div, .amud-outer > div {
      margin-bottom: 2em !important;
    }
  </style>
  <script src="https://unpkg.com/daf-renderer@latest/dist/daf-renderer.min.js"></script>
</head>
<body>
  <div id="daf"></div>

  <script>
    (function init() {
      if (!window.dafRenderer) return setTimeout(init, 20);

      const renderer = window.dafRenderer("#daf", {
        contentWidth: "900px",
        fontFamily: { 
          main: "Times New Roman, serif", 
          inner: "Arial, Helvetica, sans-serif", 
          outer: "Arial, Helvetica, sans-serif" 
        },
        // Add spacing parameters if the renderer supports them
        spacing: {
          sectionMargin: "2em",
          paragraphMargin: "1.5em"
        }
      });

      renderer.render(
        `<div style="margin-bottom: 1em; padding-bottom: 0.5em;">דער ענין פון ספרים איז דאך א ענין פון חכמה – דאס רעדט זיך דאך וועגן ספרי חכמה, און חכמהקדושה, פון חכמת התורה, במילא, אז ס׳קומט צו נאך א ספר – קומט צו אין די אלע ספרים וואס מ׳האט פון פריער נאך פאר דעם, כמובן בפשטות, אז דורך דערויף וואס ס׳קומט צו די ידיעה שבספר החדש – קומט צו אויכעט א הוספה אין די ידיעות אין די ספרים וואס מ׳האט געלערנט נאך פאר דעם, אדער מ׳גייט לערנען, און די ספרים האט מען שוין, און מ׳גייט לערנען נאכאמאל, איבערלערנען וכיוצא בזה.</div><div style="margin-bottom: 1em; padding-bottom: 0.5em;">וואס דערפאר איז אויכעט מתאים אויכעט צו יום זה, וואס דאס איז דאך פארבונדן אויכעט מיטדער שחרור פון ספרים, און פדיון שבויים פון ספרים, און כמדובר כמה פעמים, ס׳איז אויכעט נאך דא די שיריים בימים אלו, אז ס׳איז דאך דאא קבוצה פון ספרים וואס ווארטן נאך אויף זייער פדיון שבויים,אז זיי זאלן אומגעקערט ווערן צו זייער אמת׳ן בעל- הבית, וואס דאס איז דאך נשיא דורנו, דער רבי דעם שווער – אין זיינע ד׳ אמות, וואס זיי זיינעןדאך צוזאמען מיט די ד׳ אמות פון בית הכנסת, וביתהמדרש, ובית פון עשי׳ פון מעשים טובים וגמילות חסדים בפרט, וואס דאס איז דאך ״בית רבינו שבבבל״פון דעם רבי׳ן דעם שווער.</div><div style="margin-bottom: 1em; padding-bottom: 0.5em;"> און וואס מ׳וועט אומקערן תיכף ומיד ממש, ועוד והעיקר – (אין א פרשתפון) ״בנערינו ובזקנינו ובבנינו ובבנותינו״, האנשים והנשים והטף – איז ״ארו עם ענני שמיא״, צוזאמעןמיט די החלטות טובות בנוגע צו צדקה און צו מעשיםטובים בכלל ובפרט,וועט מען גלייך זיין, כמדובר, בארצנו הקדושה, און דארט – אין ירושלים עיר הקודש, ובהר הקודש,ובבית המקדש השלישי, ותיכף ומיד ממש.</div>`,
        `<div style="margin-bottom: 1em; word-wrap: break-word; overflow-wrap: break-word; width: 100%;">
        <strong></strong>
        <div style="margin-top: 0.5em;"><strong>Q&A:</strong> <strong>Question:</strong> What is the significance of involving all segments of the community in repentance and good deeds as a catalyst for spiritual renewal and redemption? <strong>Answer:</strong> The significance of involving all segments of the community—including boys, elders, sons, and daughters—in repentance and good deeds is multifaceted. First, it recognizes that true communal transformation requires participation from every generational and social group, emphasizing inclusivity and collective responsibility. This broad involvement is necessary to create a unified spiritual awakening, as symbolized by the phrase 'the people will awaken with the clouds of Heaven,' suggesting a profound and widespread divine revelation. Secondly, the connection between repenting promptly and committing to positive actions such as צדקה (charity) and מעשים טובים (good deeds) indicates that ethical and moral behavior are essential precursors to redemption. In practical terms, this collective return and righteousness prepare the environment for the eschatological hope centered on the Land of Israel, specifically Jerusalem, the Holy Mountain, and the rebuilding of the Third Temple. In summary, the text stresses that redemption is not a process for select individuals but a comprehensive communal effort encompassing all ages and genders. The combination of heartfelt return, concrete good acts, and unity is portrayed as the necessary foundation for divine blessing and the realization of the Messianic vision.</div>
      </div><div style="margin-bottom: 1em; word-wrap: break-word; overflow-wrap: break-word; width: 100%;">
        <strong></strong>
        <div style="margin-top: 0.5em;"><strong>Q&A:</strong> <strong>Question:</strong> How does studying a new Torah wisdom book affect the understanding of previously and currently studied texts? <strong>Answer:</strong> When a new Torah wisdom book is introduced, it contributes additional knowledge that integrates with the existing body of wisdom found in the previously studied or concurrently studied texts. This integration enriches and expands the learner's understanding by adding new perspectives or clarifications that were not apparent before. Essentially, the new book does not stand in isolation but interacts dynamically with earlier material, prompting a re-examination or deeper insight into those texts. As a result, the old books are often studied again, now with added understanding, which leads to an enhanced and more comprehensive grasp of the wisdom contained within. This process underscores the cumulative and interconnected nature of Torah study, where knowledge is ever-expanding and reflexively improves prior learning.</div>
      </div><div style="margin-bottom: 1em; word-wrap: break-word; overflow-wrap: break-word; width: 100%;">
        <strong></strong>
        <div style="margin-top: 0.5em;"><strong>Q&A:</strong> <strong>Question:</strong> Why is the theme of redeeming sacred books significant in a communal religious context, and what spiritual symbolism does it carry? <strong>Answer:</strong> The theme of redeeming sacred books holds deep spiritual significance because it metaphorically extends the concept of פדיון שבויים (redemption of captives), a venerable Jewish value, to the realm of Torah study and preservation. Here is an exposition of this idea: - <strong>Spiritual Symbolism of Redemption:</strong> Just as individuals can be held captive and require redemption to regain freedom and dignity, sacred texts—'ספרים'—can be viewed as captives awaiting their redemption and return to their rightful 'owner'. This owner is identified as the community's spiritual leader, the 'רבי', who represents not only leadership but also the collective spiritual soul of the generation. - <strong>Communal and Physical Boundaries (ד׳ אמות):</strong> The books exist within the symbolic four cubits ('ד׳ אמות') of the Rebbe’s domain, which is itself connected physically and spiritually with the four cubits of the synagogue ('בית הכנסת') and the study hall ('בית המדרש'). These spaces represent the focal centers of Jewish life, study, and charity. - <strong>Connection to Acts of Kindness and Good Deeds:</strong> The text references the house of good deeds and acts of kindness ('מעשים טובים וגמילות חסדים'), underscoring that redemption is not merely a physical act but also a spiritual one intimately linked to communal effort and ethical living. - <strong>Ongoing Relevance:</strong> The passage notes that multiple times this theme arises, emphasizing that the process of spiritual liberation and redemption is ongoing, reflective of the dynamic engagement with Torah and mitzvot. In essence, the redemption of sacred books allegorizes the communal responsibility to preserve, honor, and spiritually 'liberate' the Torah, fostering a living connection with the tradition and enabling its rightful restoration within the heart of the community.</div>
      </div>`,
        `<div style="margin-bottom: 1em;">
        <strong>Long Summary:</strong> The text expresses a vision of immediate and earnest repentance (תשובה) accompanied by communal unity across all ages and genders—including boys, elders, sons, and daughters. It emphasizes that such collective return, paired with positive decisions regarding charity (צדקה) and good deeds (מעשים טובים), will bring about a divine awakening and blessing described metaphorically as 'the people will awaken with the clouds of Heaven.' This spiritual renewal is expected to manifest especially in the Land of Israel, specifically in Jerusalem (ירושלים עיר הקודש), the Holy Mountain (הר הקודש), and the site of the Third Temple (בית המקדש השלישי). The text thus combines an exhortation for moral and spiritual correction with eschatological hope centered on the rebuilding of the Beit HaMikdash.<hr>
        <strong>Short Summary:</strong> The text urges immediate repentance and communal good deeds to bring about heavenly blessing and renewal, especially in Jerusalem and the Third Temple.
      </div><div style="margin-bottom: 1em;">
        <strong>Long Summary:</strong> The text discusses the nature of acquiring wisdom (חכמה), specifically concerning Torah wisdom (חכמת התורה) and holy wisdom (חכמה קדושה), through the study of books (ספרים). It highlights that the arrival of a new book contributes additional knowledge that can integrate with and enhance the understanding of previously studied or currently studied books. This addition is not merely additive but enriches and supplements the existing knowledge base in those earlier or concurrent texts. The process described implies a cumulative and interconnected dynamic in studying Torah wisdom, where new insights continuously create a ripple effect that recontextualizes and deepens the meaning of earlier learning.<hr>
        <strong>Short Summary:</strong> The introduction of a new Torah wisdom book adds and enriches the knowledge in already studied or concurrent books, thereby deepening the overall learning process.
      </div><div style="margin-bottom: 1em;">
        <strong>Long Summary:</strong> The text discusses the connection between a specific day and themes of Jewish spiritual and communal significance. It highlights that this day is appropriate due to its association with the liberation (שחרור) and redemption (פדיון) of sacred texts (ספרים). It refers to multiple occurrences of this theme, underscoring the ongoing presence of groups of sacred books awaiting their redemption or release from captivity to return to their true owners, identified as the community's spiritual leader, the 'רבי'. The text further situates these texts within the physical and spiritual boundaries symbolized by the four cubits (ד׳ אמות) of the synagogue (בית הכנסת), the study hall (בית המדרש), and the house of good deeds and acts of kindness (בית של עשיית מעשים טובים וגמילות חסדים).<hr>
        <strong>Short Summary:</strong> The passage relates a specific day to the spiritual release and redemption of sacred books, awaiting to return to the community's leader within the symbolic four cubits of communal religious spaces.
      </div>`,
        "b"
      );
    })();
  </script>
</body>
</html>
