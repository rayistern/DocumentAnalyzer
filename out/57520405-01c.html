<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <title>Daf</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #daf {
      margin: 2rem;
    }
    /* System fonts with Hebrew support */
    [lang="he"] {
      font-family: "Times New Roman", serif;
    }
    [lang="en"], .commentary {
      font-family: "Arial", "Helvetica", sans-serif;
    }
    
    /* Override renderer styles with !important */
    .amud-main > div {
      margin-bottom: 2em !important;
      padding-bottom: 1em !important;
    }
    .amud-inner > div, .amud-outer > div {
      margin-bottom: 2em !important;
    }
  </style>
  <script src="https://unpkg.com/daf-renderer@latest/dist/daf-renderer.min.js"></script>
</head>
<body>
  <div id="daf"></div>

  <script>
    (function init() {
      if (!window.dafRenderer) return setTimeout(init, 20);

      const renderer = window.dafRenderer("#daf", {
        contentWidth: "900px",
        fontFamily: { 
          main: "Times New Roman, serif", 
          inner: "Arial, Helvetica, sans-serif", 
          outer: "Arial, Helvetica, sans-serif" 
        },
        // Add spacing parameters if the renderer supports them
        spacing: {
          sectionMargin: "2em",
          paragraphMargin: "1.5em"
        }
      });

      renderer.render(
        `<div dir="ltr" style="margin-bottom: 1em; padding-bottom: 0.5em;"><span style="font-size: 1.7em;">בהנוגע</span> צו יעדער מצוה איז דאך דא דער כלל אין ״דבר משנה״, וואס ״דבר משנה״ איז דאך א קורצער לשון און א לשון ברור, הלכה למעשה, און האט א שייכות מיוחדה צו די גאולה האמיתית והשלימה, ווי אראּפ געבראכט אין חסידות בכלל, און אין תורה אור במיוחד, אז בזכות המשניות וועט מען ארויס פון גלות און פון דעם גלות זה,ותיכף ומיד ממש, וויבאלד אז מ׳איז מוסיף בזה, און מחליט אויף מוסיף זיין נאכמערער און נאכמערער, און דער אויבערשטער זעט דאך, אז דאס איז החלטות אמיתיות, אז מ׳וועט עס זיכער מקיים זיין – איזדאך אזיכערע זאך אז דאס איז פועל בהנוגע למעשהּ בפועל פונקט ווי מ׳וואלט שוין געלערנט די משניות׳ן, עאכו״כ אז די החלטות ווערן אנגענומען אין א מקום קדוש, ווי אין דעם ארט אין וועלכען מ׳געפינט זיך איצטער, וואס דאס איז דאך א בית המשולש, כמדובר כמה פעמים – אבית פון תפילה, און א בית פון תורה, און א בית פון החלטות טובות אין מעשים טובים, אנהויבנדיק פון גמילות חסדים וצדקה,וכמדובר כמה פעמים.און ס׳האט דאך אויכעט א שייכות צו פרשת השבוע, וואס דאס איז דאך פון ״ויגש אליו יהודה״, כמדובר בארוכה אין די התוועדות שלפני זה, אזדאס איז דער ענין פארבונדן במיוחד מיט די גאולה האמיתית והשלימה, וואס דאס איז אויכעט דער ״ויגש אליו יהודה״, צו וועמען? – צו יוסף׳ן, וואס יוסף און יהודה איז דאך דאס ״סמיכת גאולה לתפילה״, ווי די גמרא לערנט אּפ דערפון, ועד כדי כך אז דערפאר טאר ניט זיין קיין הפסקצווישן גאולה לתפילה, אפילו ניט מיט ענינים של קדושה, ווי לימוד התורה וכיוצא בזה, אדער תפילות אחרות, נאר גלייך פון ״גאל ישראל״ – גייט מען גלייךאריבער אין אדנ-י שפתי תפתח ופי יגיד תהלתך</div><div dir="ltr" style="margin-bottom: 1em; padding-bottom: 0.5em;">״, וואס דאס איז דאך ״כתפילה אריכתא דמיא״, גאולה אריכתא דמיא – א התחלה פון די תפילה שלאחרי זה, און אזוי אויכעט איז מען דאך זיכער, אז דעראויבערשטער וועט ניט מעכב זיין ח״ו ״אפילו כהרףעין״, און תיכף צו דעם ענין הצדקה ״שמקרבת אתהגאולה״, וואס מ׳גייט איצטער מאכן יעדערען פון אייך אויף א שליח לצדקה, דורך געבן צוויי שטרות – איין שטר אויף טאן כטוב בעיניו, און א צווייטן שטר אויףאן ענין הצדקה, און צדקה אין אן אופן, אז דאס זאל גלייך פועל זיין, ניט סתם זירוז, וואס אזירוז האט דאך אויכעט אין דערויף כמה שיעורים ואופנים – זאל דאס זייןאזירוז על דרך פון סמיכת גאולה לתפילה, אז דער זירוז איז, אז אפילו קיין רגע כמימרא איז מען אויך ניט מפסיק, נאר גלייך פון ״גאל ישראל״ גייט מעןאריבער אין ״תפילה אריכתא״, אין ״אדנ-י שפתיתפתח״. און ויהי רצון, אז ס׳זאל זיין גלייך סמיכתגאולה לתפילה, ובפרט ע״י מעשה הצדקה הנוסף,המדובר זה עתה, בהוספה אויף צדקה הרגילה –זאל זיין תיכף ומיד ממש, נאך קודם פון דעם המשך הדיבור בכל דברים אלו, און ס׳זאל זיין תיכף ומידממש גאולה האמיתית והשלימה ע״י משיח צדקנו, און צוזאמען מיט אליהו הנביא זכור לטוב המבשר את הגאולה, צוזאמען מיט דער גאולה בפשטות.ועוד והוא העיקר – תיכף ומיד ממש, ו״בנערינוובזקנינו ובבנינו ובבנותינו״, וועט מען ממשיךאּפגעבן די צדקה, און דעם המשך – בארצנו הקדושה,ובירושלים עיר הקודש, ובהר הקודש, אויב חס ושלום ס׳וועט זיין א עיכוב – וועט מען דאס אּפגעבן בזריזות יעדערער במקומו ובעירו בהוספה מדילי׳.</div>`,
        `<div style="margin-bottom: 1em; word-wrap: break-word; overflow-wrap: break-word; width: 100%; direction: ltr;">
        <strong></strong>
        <div style="margin-top: 0.5em;"><strong>Question:</strong> Why does the speaker emphasize giving charity immediately and without interruption as a means to bring about redemption? <strong>Answer:</strong> The speaker underscores the importance of giving charity (צדקה) with urgency and without delay because, within the framework presented, such action parallels the ideal joining of 'גאולה' (redemption) and 'תפילה' (prayer) known as 'סמיכת גאולה לתפילה'—that is, connecting redemption to prayer without any pause. This concept is rooted in the tradition of moving directly from the blessing of 'גאל ישראל' (He Who redeemed Israel) into 'תפילה' (the Amidah prayer) without interruption, symbolizing a continuous, uninterrupted flow toward spiritual elevation. In practical terms, the text encourages swift and energetic fulfillment of the mitzvah of charity by appointing every individual as a 'שליח' (emissary) for charitable giving, with two separate allocations: one for discretionary charitable acts and another specifically earmarked for the mitzvah of צדקה. This should be accomplished with the utmost 'זריזות' (alacrity), even surpassing ordinary levels of promptness, such that no moment—even 'as the blink of an eye'—separates the charitable act from the subsequent spiritual aspiration. The rationale presented is that immediate and energetic charity, particularly when added to regular giving, serves as a catalyst that draws redemption closer—not just in theory, but in a real and tangible way. This approach is reinforced with the assurance of divine providence, emphasizing that Hashem will not delay redemption, and that our prompt actions can effectuate the 'גאולה האמיתית והשלימה' (the true and complete redemption) through 'משיח צדקנו' (our righteous redeemer), with Elijah the Prophet heralding the news. In summary, the urgency in giving charity is both a practical and a spiritual imperative, designed to elicit an immediate response from Heaven and serve as the last step before redemption, reflecting a state of readiness and unbroken spiritual momentum.</div>
      </div><div style="margin-bottom: 1em; word-wrap: break-word; overflow-wrap: break-word; width: 100%; direction: ltr;">
        <strong></strong>
        <div style="margin-top: 0.5em;"><strong>Question:</strong> How does making practical resolutions to study mishnayot, especially in a sacred communal setting, influence one's spiritual reality and broader redemption according to the text's teachings? <strong>Answer:</strong> Great question! According to the text, making concrete resolutions to study mishnayot holds significant spiritual and practical power, particularly when these resolutions are undertaken in a sacred communal environment referred to as 'בית המשולש'—a place dedicated to prayer, Torah study, and good resolutions/actions. Let's break down the mechanics and implications: - <strong>Power of a 'דבר משנה':</strong> The concise and clear formulation of halachic rulings in 'דבר משנה' gives these commitments a straightforward, practical edge. Such clarity is valued both for its effectiveness in halacha and for its symbolic connection to redemption. - <strong>Learning Mishnayot as a Redemptive Act:</strong> Drawing upon Chassidic teachings (and especially Torah Ohr), the text emphasizes that the study of mishnayot is so powerful that it merits deliverance from exile—'בזכות המשניות וועט מען ארויס פון גלות'. Thus, every additional commitment to study, especially firm and genuine resolutions, is considered spiritually transformative. - <strong>Significance of Setting:</strong> When these resolutions are made in a space invested with holiness—one that is not only a house of prayer and Torah but also of good resolutions and deeds—there is a belief that this amplifies the effectiveness, equating the intention and decision to actual accomplishment ('פועל בהנוגע למעשהּ בפועל פונקט ווי מ׳וואלט שוין געלערנט...'). - <strong>Contextual and Thematic Connections:</strong> The text further binds this practice to the weekly Torah portion 'ויגש אליו יהודה', which, as explained in Chassidic discourse, represents the unification necessary for redemption. This, in turn, is reflected in the prayer structure termed 'סמיכת גאולה לתפילה', the seamless transition from redemption to prayer. <strong>Takeaway:</strong> By committing to learn and increase in mishnayot, especially within a sacred, communal 'triple house', one activates spiritual dynamics closely associated with redemption and the transformation of exile into deliverance. This act is not just symbolic but is believed to have direct, practical impact both individually and communally.</div>
      </div>`,
        `<div dir="ltr" style="margin-bottom: 1em;">
        
        <div>The passage urges immediate צדקה (charity) as a catalyst for גאולה (redemption), stressing uninterrupted zeal like the connection between גאל ישראל and תפילה, and calls for prompt action by all, even in case of delay.</div>
        <div>This text discusses the importance and urgency of performing the mitzvah of צדקה (charity) as an immediate precursor to the geulah (redemption). The speaker likens the urgency to the uninterrupted transition between 'גאל ישראל' and 'תפילה אריכתא' in prayer, emphasizing not delaying even for the briefest moment. The text conveys certainty that Hashem will not delay the redemption and encourages the immediate giving of צדקה, assigning individuals as emissaries to distribute charity with two notes: one for discretionary giving and one specifically for צדקה. The proper way to fulfill this is with the utmost alacrity, paralleling the concept of 'סמיכת גאולה לתפילה'—where redemption and prayer are joined without interruption. This act of immediate, additional צדקה (beyond regular giving) is asserted as a way to bring about both personal and communal redemption swiftly and with absolute completeness, together with Eliyahu HaNavi and the full, manifest geulah in Eretz Yisrael and Jerusalem. If, G-d forbid, there is any delay, charity should be given instantly in everyone's place and city.</div>
      </div><div dir="ltr" style="margin-bottom: 1em;">
        
        <div>The text explores the unique power of concise halachic statements ('דבר משנה') and the study of 'משניות' to bring about redemption, especially when resolutions are undertaken in a sacred space, and links these concepts to the Torah portion 'ויגש אליו יהודה' and the structure of communal prayer.</div>
        <div>The passage addresses the significance of 'דבר משנה'—a concise and clear halachic formulation—in the context of every mitzvah. It highlights the special connection between the study and commitment to 'משניות' and the anticipated final redemption (גאולה האמיתית והשלימה), a theme found prominently in Chassidic teachings and particularly in Torah Ohr. The act of increasing and firmly resolving to increase one's engagement in learning 'משניות', especially when such resolutions are made in a sacred environment ('בית המשולש'—a place of prayer, Torah, and good resolutions/deeds), is considered to have direct practical effectiveness, as if the Mishnayot had already been studied. The text also ties these concepts to the weekly Torah portion, 'ויגש אליו יהודה', drawing connections to the unification of elements necessary for redemption and the liturgical linkage ('סמיכת גאולה לתפילה') derived from the actions of Yehuda and Yosef, as discussed in prior Chassidic gatherings.</div>
      </div>`,
        "b"
      );
    })();
  </script>
</body>
</html>
